; FORIOT / generic ESP32-S3-CAM, ESP32-S3-WROOM-1 N16R8, OV3660.
; Logs stay on the TTL USB-C port (CH340 UART0, GPIO43/44).
; Image capture uses the OTG port as a TinyUSB CDC device. The USB-Serial/JTAG
; controller on that jack resets the chip whenever the port is opened.

[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0

monitor_speed = 115200
; 921600 drops the CH34x link on this board right after the stub starts.
upload_speed = 115200
upload_protocol = esptool
