<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <style>
    .b { fill: #ffffff; stroke: #9aa5b5; stroke-width: 1.2; }
    .k { fill: #e6f3f4; stroke: #0f6c7a; stroke-width: 1.4; }
    .t { fill: #1c2330; font-weight: 600; }
    .s { fill: #5b6678; font-size: 10.5px; }
    .n { fill: #0f6c7a; font-weight: 700; font-size: 11px; }
    .ln { stroke: #5b6678; stroke-width: 1.3; fill: none; marker-end: url(#q); }
  </style>

  <rect class="k" x="10" y="20" width="740" height="40" rx="6"/>
  <text class="t" x="24" y="45">&#8220;Show me between 12:00 and 12:30 where the machine picks up a pipette tip.&#8221;</text>

  <rect class="b" x="10" y="85" width="170" height="100" rx="6"/>
  <text class="n" x="22" y="104">1 &#183; PLAN</text>
  <text class="s" x="22" y="122">Model parses the time window</text>
  <text class="s" x="22" y="136">(device time zone) and the</text>
  <text class="s" x="22" y="150">event: &#8220;pipette tip pickup&#8221;.</text>

  <rect class="b" x="200" y="85" width="170" height="100" rx="6"/>
  <text class="n" x="212" y="104">2 &#183; SEARCH (on device)</text>
  <text class="s" x="212" y="122">search_index over captions,</text>
  <text class="s" x="212" y="136">tags, watch-list hits, robot</text>
  <text class="s" x="212" y="150">marks &#8594; ranked candidates.</text>
  <text class="s" x="212" y="164">Text only. Fast and cheap.</text>

  <rect class="b" x="390" y="85" width="170" height="100" rx="6"/>
  <text class="n" x="402" y="104">3 &#183; VERIFY (vision)</text>
  <text class="s" x="402" y="122">inspect_window pulls dense</text>
  <text class="s" x="402" y="136">frames from SD around each</text>
  <text class="s" x="402" y="150">candidate; model confirms and</text>
  <text class="s" x="402" y="164">tightens start / end.</text>

  <rect class="k" x="580" y="85" width="170" height="100" rx="6"/>
  <text class="n" x="592" y="104">4 &#183; ANSWER</text>
  <text class="s" x="592" y="122">12:07:41&#8211;12:07:46 (0.93)</text>
  <text class="s" x="592" y="136">12:19:02&#8211;12:19:07 (0.88)</text>
  <text class="s" x="592" y="150">thumbnails + clip URLs;</text>
  <text class="s" x="592" y="164">result written back to index.</text>

  <path class="ln" d="M180,135 L198,135"/>
  <path class="ln" d="M370,135 L388,135"/>
  <path class="ln" d="M560,135 L578,135"/>
</svg>
