<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #9aa5b5; stroke-width: 1.2; }
    .dev { fill: #e6f3f4; stroke: #0f6c7a; stroke-width: 1.6; }
    .cloud { fill: #f3effa; stroke: #6b4fa0; stroke-width: 1.4; }
    .sd { fill: #fff6e0; stroke: #9a6700; stroke-width: 1.3; }
    .t { fill: #1c2330; }
    .h { fill: #0f6c7a; font-weight: 700; font-size: 13px; }
    .s { fill: #5b6678; font-size: 10.5px; }
    .ln { stroke: #5b6678; stroke-width: 1.3; fill: none; marker-end: url(#a); }
    .dl { stroke: #6b4fa0; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#a); }
  </style>

  <!-- scene -->
  <rect class="box" x="10" y="140" width="110" height="80" rx="8"/>
  <text class="t" x="65" y="172" text-anchor="middle" font-weight="600">Robot / machine</text>
  <text class="s" x="65" y="190" text-anchor="middle">pipettes, arms,</text>
  <text class="s" x="65" y="204" text-anchor="middle">mobile bases</text>

  <!-- device -->
  <rect class="dev" x="150" y="20" width="370" height="340" rx="12"/>
  <text class="h" x="165" y="42">Gizmonic Cambot (ESP32-S3 + OV3660)</text>

  <rect class="box" x="168" y="60" width="100" height="44" rx="6"/>
  <text class="t" x="218" y="80" text-anchor="middle" font-weight="600">Capture</text>
  <text class="s" x="218" y="95" text-anchor="middle">VGA JPEG ~5 fps</text>

  <rect class="box" x="300" y="60" width="200" height="44" rx="6"/>
  <text class="t" x="400" y="80" text-anchor="middle" font-weight="600">Recorder</text>
  <text class="s" x="400" y="95" text-anchor="middle">60 s segments + frame index</text>

  <rect class="sd" x="300" y="122" width="200" height="56" rx="6"/>
  <text class="t" x="400" y="144" text-anchor="middle" font-weight="600">microSD rolling buffer</text>
  <text class="s" x="400" y="160" text-anchor="middle">video &#183; semantic index &#183; events</text>
  <text class="s" x="400" y="172" text-anchor="middle">oldest segments deleted first</text>

  <rect class="box" x="168" y="122" width="100" height="56" rx="6"/>
  <text class="t" x="218" y="143" text-anchor="middle" font-weight="600">Activity</text>
  <text class="s" x="218" y="158" text-anchor="middle">1/8-scale motion</text>
  <text class="s" x="218" y="171" text-anchor="middle">score per frame</text>

  <rect class="box" x="168" y="198" width="160" height="56" rx="6"/>
  <text class="t" x="248" y="219" text-anchor="middle" font-weight="600">Indexer</text>
  <text class="s" x="248" y="234" text-anchor="middle">keyframes &#8594; GPT captions,</text>
  <text class="s" x="248" y="247" text-anchor="middle">JEV nouls, events</text>

  <rect class="box" x="345" y="198" width="155" height="56" rx="6"/>
  <text class="t" x="422" y="219" text-anchor="middle" font-weight="600">MCP tools</text>
  <text class="s" x="422" y="234" text-anchor="middle">search &#183; inspect &#183;</text>
  <text class="s" x="422" y="247" text-anchor="middle">clip on device</text>

  <rect class="box" x="168" y="276" width="332" height="66" rx="6"/>
  <text class="t" x="334" y="298" text-anchor="middle" font-weight="600">API surface</text>
  <text class="s" x="334" y="314" text-anchor="middle">REST /api/v1 &#183; MCP /mcp &#183; register</text>
  <text class="s" x="334" y="329" text-anchor="middle">bearer-token auth &#183; GPT + JEV indexing</text>

  <!-- cloud -->
  <rect class="cloud" x="580" y="150" width="170" height="90" rx="40"/>
  <text class="t" x="665" y="186" text-anchor="middle" font-weight="600">Cloud models</text>
  <text class="s" x="665" y="202" text-anchor="middle">GPT captions + ask</text>
  <text class="s" x="665" y="216" text-anchor="middle">JEV / TypeSafe nouls</text>

  <!-- clients -->
  <rect class="box" x="580" y="275" width="170" height="78" rx="8"/>
  <text class="t" x="665" y="296" text-anchor="middle" font-weight="600">Clients</text>
  <text class="s" x="665" y="312" text-anchor="middle">LAN registrar (UI + ask)</text>
  <text class="s" x="665" y="326" text-anchor="middle">Cursor / any MCP agent</text>
  <text class="s" x="665" y="340" text-anchor="middle">scripts via REST</text>

  <!-- arrows -->
  <path class="ln" d="M120,165 C140,120 145,95 166,84"/>
  <text class="s" x="104" y="122">light</text>
  <path class="ln" d="M268,82 L298,82"/>
  <path class="ln" d="M400,104 L400,120"/>
  <path class="ln" d="M218,104 L218,120"/>
  <path class="ln" d="M218,178 L218,196"/>
  <path class="ln" d="M300,165 C280,185 275,190 270,196"/>
  <path class="ln" d="M328,226 L343,226"/>
  <path class="ln" d="M440,198 L440,180"/>
  <path class="ln" d="M422,254 L422,274"/>
  <path class="dl" d="M328,206 L336,206 L336,188 L578,188"/>
  <path class="dl" d="M500,226 L578,212"/>
  <path class="ln" d="M578,312 L502,312"/>
  <path class="ln" d="M502,300 L578,300"/>
</svg>
